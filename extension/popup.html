<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 14px;
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }
    h1 svg { flex-shrink: 0; }
    .info-row {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 10px;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
    }
    .info-row .id {
      color: #e94560;
      font-family: monospace;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 3px;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #333;
      border-radius: 5px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    input:focus { border-color: #e94560; }
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
      margin: 10px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      font-family: inherit;
    }
    .btn-download {
      background: #e94560;
      color: #fff;
    }
    .btn-download:hover { background: #c73e55; }
    .btn-download:disabled { opacity: 0.4; cursor: not-allowed; }
    #result {
      margin-top: 10px;
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s, padding 0.3s;
      border-radius: 6px;
    }
    #result.show {
      max-height: 500px;
      padding: 10px;
      overflow-y: auto;
    }
    #result.ok { background: rgba(76, 175, 80, 0.12); border: 1px solid rgba(76, 175, 80, 0.3); }
    #result.err { background: rgba(244, 67, 54, 0.12); border: 1px solid rgba(244, 67, 54, 0.3); }
    .result-title {
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 4px;
      color: #fff;
    }
    .result-detail {
      font-size: 11px;
      color: #ccc;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .cmd {
      background: #0f3460;
      padding: 5px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      color: #4caf50;
      margin-top: 6px;
    }
    .warn-list { margin-top: 4px; }
    .warn-item {
      font-size: 11px;
      color: #ff9800;
      line-height: 1.4;
      margin-top: 2px;
      padding-left: 14px;
      position: relative;
    }
    .warn-item::before { content: "⚠"; position: absolute; left: 0; }
    .no-shader {
      text-align: center;
      color: #666;
      font-size: 12px;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <h1>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <rect x="1" y="1" width="18" height="18" rx="3" stroke="#e94560" stroke-width="1.5"/>
      <path d="M6 14l4-10 4 10" stroke="#e94560" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7.5 11h5" stroke="#e94560" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    shadertoy2mc
  </h1>

  <div class="info-row" id="shaderInfo">
    <span class="no-shader">Navigate to a ShaderToy shader page</span>
  </div>

  <div id="optionsPane" style="display:none">
    <div class="options">
      <div>
        <label>Namespace</label>
        <input type="text" id="optNamespace" value="minecraft" placeholder="minecraft">
      </div>
      <div>
        <label>Time Scale (s)</label>
        <input type="number" id="optTimeScale" value="1200" min="1">
      </div>
    </div>

    <button class="btn-download" id="btnDownload" disabled>
      Download Resource Pack ZIP
    </button>
  </div>

  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
